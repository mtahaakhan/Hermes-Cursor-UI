name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui:
    name: Browser UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/desktop
      - run: npm run test --workspace apps/desktop
      - run: npm run lint --workspace apps/desktop
      - run: npm run build --workspace apps/desktop

  launcher:
    name: Launcher and installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: python -m pytest tests/hermes_cli/test_cursor_ui.py tests/hermes_cli/test_gui_command.py tests/hermes_cli/test_browser_app.py -q
      - name: Validate POSIX launchers
        run: sh -n install.sh bin/hermes-cursor

  powershell-installer:
    name: PowerShell installer syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
